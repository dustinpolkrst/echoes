name: Deploy dev blog

on:
  push:
    branches: [main]
    paths: ["devblog/**", "game/**", "web/**", "scripts/build-web.sh", ".github/workflows/devblog.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the browser version of the game
        run: bash scripts/build-web.sh devblog/static/play/game
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --source devblog --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: devblog/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
