<ol class="postlist">
  {{ range . }}
  <li>
    <a href="{{ .RelPermalink }}">
      {{ with .Params.cover }}<img src="{{ . | relURL }}" alt="" loading="lazy" class="game">{{ end }}
      <span class="text">
        {{ with .Params.part }}<span class="kicker">Part {{ . }}</span>{{ end }}
        <span class="title">{{ .Title }}</span>
        <span class="summary">{{ .Description }}</span>
      </span>
    </a>
  </li>
  {{ end }}
</ol>
